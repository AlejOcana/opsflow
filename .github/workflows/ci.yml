name: OpsFlow CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: API unit tests (.NET)
  # ─────────────────────────────────────────────
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opsflow-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tests/OpsFlow.Api.Tests/OpsFlow.Api.Tests.csproj

      - name: Build
        run: dotnet build tests/OpsFlow.Api.Tests/OpsFlow.Api.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/OpsFlow.Api.Tests/OpsFlow.Api.Tests.csproj -c Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: opsflow-api/tests/OpsFlow.Api.Tests/TestResults/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 2: Frontend E2E tests (Playwright)
  # ─────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opsflow-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: opsflow-web/pnpm-lock.yaml

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Angular (production)
        run: pnpm run build --configuration production
        env:
          API_URL: 'https://opsflow-api-ej8p.onrender.com/api'

      - name: Run E2E tests
        run: pnpm exec playwright test --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: opsflow-web/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: opsflow-web/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 3: Frontend unit tests (Jest)
  # ─────────────────────────────────────────────
  unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opsflow-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: opsflow-web/pnpm-lock.yaml

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Jest unit tests
        run: pnpm exec jest --coverage --passWithNoTests
        env:
          CI: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: opsflow-web/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 4: Angular build verification
  # ─────────────────────────────────────────────
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opsflow-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: opsflow-web/pnpm-lock.yaml

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (development)
        run: pnpm run build --configuration development

      - name: Build (production)
        run: pnpm run build --configuration production
        env:
          API_URL: 'https://opsflow-api-ej8p.onrender.com/api'
